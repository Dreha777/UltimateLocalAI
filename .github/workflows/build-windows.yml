name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  quick-check:
    name: Fast GUI compile check
    if: github.event_name == 'push'
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout Ultimate Local AI
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore GUI
        shell: pwsh
        run: dotnet restore src/UltimateLocalAI/UltimateLocalAI.csproj --configfile NuGet.config --ignore-failed-sources

      - name: Build GUI
        shell: pwsh
        run: dotnet build src/UltimateLocalAI/UltimateLocalAI.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Prepare GUI patch
        shell: pwsh
        run: |
          $releaseRoot = "src/UltimateLocalAI/bin/Release"
          $dll = Get-ChildItem $releaseRoot -Recurse -Filter "UltimateLocalAI.dll" |
            Where-Object { $_.FullName -notmatch "\\ref\\" } |
            Select-Object -First 1

          if (-not $dll) {
            throw "UltimateLocalAI.dll not found after GUI build."
          }

          $patchDir = "dist/UltimateLocalAI-GUI-Patch"
          $zip = "dist/UltimateLocalAI-GUI-Patch.zip"
          New-Item -ItemType Directory -Force $patchDir | Out-Null
          Copy-Item $dll.FullName (Join-Path $patchDir "UltimateLocalAI.dll") -Force

          $pdb = [System.IO.Path]::ChangeExtension($dll.FullName, ".pdb")
          if (Test-Path $pdb) {
            Copy-Item $pdb (Join-Path $patchDir "UltimateLocalAI.pdb") -Force
          }

          @"
          ULTIMATE LOCAL AI - FAST GUI PATCH
          Commit: $env:GITHUB_SHA
          Run: $env:GITHUB_RUN_NUMBER

          Installation:
          1. Close UltimateLocalAI.exe completely.
          2. Open a previously downloaded FULL Portable build.
          3. Make a backup copy of its UltimateLocalAI.dll.
          4. Replace UltimateLocalAI.dll in the Portable root with the file from this patch.
          5. Do not replace the backends folder or the .NET runtime files.

          This patch is intended for C#/XAML-only changes.
          If project dependencies or native llama.cpp runtimes change, use a new FULL Portable build instead.
          "@ | Set-Content (Join-Path $patchDir "PATCH_README.txt") -Encoding UTF8

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }
          Compress-Archive -Path "$patchDir/*" -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object Name, Length

      - name: Upload GUI patch
        uses: actions/upload-artifact@v4
        with:
          name: UltimateLocalAI-GUI-Patch
          path: dist/UltimateLocalAI-GUI-Patch.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  full-build:
    name: Full Windows x64 portable
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout Ultimate Local AI
        uses: actions/checkout@v4

      - name: Checkout llama.cpp stable b11060
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: b11060
          path: vendor/llama-stable
          fetch-depth: 1

      - name: Checkout latest llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: vendor/llama-latest
          fetch-depth: 1

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install CUDA Toolkit 12.8.1
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: '12.8.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Environment diagnostics
        shell: pwsh
        run: |
          Write-Host "===== DOTNET ====="
          dotnet --info
          Write-Host "===== CMAKE ====="
          cmake --version
          Write-Host "===== CUDA ====="
          nvcc --version
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          Write-Host "===== MSVC ====="
          Get-Command cl.exe -ErrorAction SilentlyContinue

      - name: Check project files
        shell: pwsh
        run: |
          $required = @(
            "src/UltimateLocalAI/UltimateLocalAI.csproj",
            "scripts/Build-GitHub.ps1",
            "FIRST_START_RU.txt",
            "THIRD_PARTY_NOTICES.md",
            "vendor/llama-stable/CMakeLists.txt",
            "vendor/llama-latest/CMakeLists.txt"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required file not found: $file"
            }
            Write-Host "OK: $file"
          }

      - name: Build GUI and llama.cpp runtimes
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          ./scripts/Build-GitHub.ps1

      - name: Smoke-check portable package
        shell: pwsh
        run: |
          $root = "dist/UltimateLocalAI-Portable"
          $required = @(
            "$root/UltimateLocalAI.exe",
            "$root/backends/stable/cpu-avx/llama-server.exe",
            "$root/backends/stable/cpu-avx2/llama-server.exe",
            "$root/backends/stable/cuda-pascal-avx/llama-server.exe",
            "$root/backends/latest/cpu-avx/llama-server.exe",
            "$root/backends/latest/cpu-avx2/llama-server.exe",
            "$root/backends/latest/cuda-pascal-avx/llama-server.exe"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing required artifact: $file"
            }
            $size = (Get-Item $file).Length
            Write-Host "OK: $file ($size bytes)"
          }
          Write-Host ""
          Write-Host "===== BACKENDS ====="
          Get-ChildItem "$root/backends" -Recurse -Filter llama-server.exe | Select-Object FullName, Length

      - name: Create ZIP
        shell: pwsh
        run: |
          $source = "dist/UltimateLocalAI-Portable"
          $zip = "dist/UltimateLocalAI-Portable.zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }
          Compress-Archive -Path "$source/*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created: $zip"
          Get-Item $zip | Select-Object Name, Length

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: UltimateLocalAI-Portable
          path: dist/UltimateLocalAI-Portable/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Upload ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: UltimateLocalAI-Portable-ZIP
          path: dist/UltimateLocalAI-Portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
